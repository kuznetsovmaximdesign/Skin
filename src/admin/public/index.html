<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora - Skin Bot Admin</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122a;
      --bg-card: #1a1a3e;
      --bg-card-hover: #222255;
      --border: #2a2a5a;
      --text-primary: #e8e8f0;
      --text-secondary: #9090b0;
      --text-muted: #606080;
      --aurora-1: #7b68ee;
      --aurora-2: #00d4aa;
      --aurora-3: #ff6b9d;
      --aurora-4: #ffa64d;
      --accent: #7b68ee;
      --accent-glow: rgba(123, 104, 238, 0.3);
      --success: #00d4aa;
      --danger: #ff6b9d;
      --warning: #ffa64d;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* Aurora background effect */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(123, 104, 238, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(0, 212, 170, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 80%, rgba(255, 107, 157, 0.05) 0%, transparent 50%);
      animation: aurora 20s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes aurora {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-2%, 1%) rotate(1deg); }
      100% { transform: translate(1%, -1%) rotate(-1deg); }
    }

    /* Layout */
    .app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      padding: 0;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo-text h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-text span {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .nav {
      padding: 16px 12px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .nav-item:hover {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(123, 104, 238, 0.15), rgba(0, 212, 170, 0.1));
      color: var(--text-primary);
      border: 1px solid rgba(123, 104, 238, 0.3);
    }

    .nav-item .icon { font-size: 18px; width: 24px; text-align: center; }
    .nav-item .badge {
      margin-left: auto;
      background: var(--accent);
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
    }

    .export-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .export-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
      border-color: var(--accent);
    }

    /* Main content */
    .main {
      flex: 1;
      margin-left: 260px;
      padding: 32px;
    }

    .page-header {
      margin-bottom: 32px;
    }

    .page-header h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .page-header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* Stats cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: 16px 16px 0 0;
    }

    .stat-card.purple::before { background: linear-gradient(90deg, var(--aurora-1), var(--aurora-2)); }
    .stat-card.green::before { background: linear-gradient(90deg, var(--aurora-2), #00ffcc); }
    .stat-card.pink::before { background: linear-gradient(90deg, var(--aurora-3), var(--aurora-1)); }
    .stat-card.orange::before { background: linear-gradient(90deg, var(--aurora-4), var(--aurora-3)); }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 8px 32px var(--accent-glow);
    }

    .stat-icon {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Table */
    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }

    .table-header h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .table-header .count {
      color: var(--text-muted);
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 12px 24px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }

    td {
      padding: 16px 24px;
      font-size: 14px;
      border-bottom: 1px solid rgba(42, 42, 90, 0.5);
      vertical-align: top;
    }

    tr:hover td {
      background: rgba(123, 104, 238, 0.03);
    }

    tr:last-child td { border-bottom: none; }

    .analysis-text {
      max-width: 500px;
      line-height: 1.5;
      white-space: pre-wrap;
      font-size: 13px;
      color: var(--text-secondary);
      max-height: 80px;
      overflow: hidden;
      cursor: pointer;
      transition: max-height 0.3s;
    }

    .analysis-text.expanded {
      max-height: none;
    }

    .score-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .score-good { background: rgba(0, 212, 170, 0.15); color: var(--success); }
    .score-mid { background: rgba(255, 166, 77, 0.15); color: var(--warning); }
    .score-bad { background: rgba(255, 107, 157, 0.15); color: var(--danger); }

    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .type-food { background: rgba(255, 166, 77, 0.15); color: var(--warning); }
    .type-skin { background: rgba(123, 104, 238, 0.15); color: var(--aurora-1); }
    .type-cosmetic { background: rgba(0, 212, 170, 0.15); color: var(--success); }

    .date-text {
      color: var(--text-muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .user-id {
      font-family: monospace;
      font-size: 13px;
      color: var(--aurora-1);
    }

    .delete-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
    }

    .delete-btn:hover {
      background: rgba(255, 107, 157, 0.1);
      border-color: var(--danger);
      color: var(--danger);
    }

    /* Users page */
    .user-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 12px;
      transition: all 0.2s;
    }

    .user-card:hover {
      border-color: var(--accent);
      transform: translateX(4px);
    }

    .user-avatar {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .user-info { flex: 1; }
    .user-info h4 { font-size: 15px; margin-bottom: 4px; }
    .user-info p { font-size: 13px; color: var(--text-secondary); }

    .user-stats {
      display: flex;
      gap: 16px;
    }

    .user-stat {
      text-align: center;
    }

    .user-stat .num {
      font-size: 18px;
      font-weight: 700;
    }

    .user-stat .label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px;
    }

    .page-btn {
      padding: 8px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: all 0.2s;
    }

    .page-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .page-info {
      color: var(--text-muted);
      font-size: 13px;
      padding: 0 12px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text-secondary); }
    .empty-state p { font-size: 14px; }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 16px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 14px;
      color: var(--text-primary);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      z-index: 100;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* =============================================
       TASKS PAGE
       ============================================= */

    /* Progress bar */
    .progress-bar-wrap {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .progress-header h3 { font-size: 15px; font-weight: 600; }

    .progress-percent {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--bg-primary);
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--aurora-1), var(--aurora-2));
      border-radius: 5px;
      transition: width 0.5s ease;
    }

    .progress-stats {
      display: flex;
      gap: 24px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .progress-stats span { display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot-done { background: var(--success); }
    .dot-progress { background: var(--aurora-1); }
    .dot-todo { background: var(--text-muted); }

    /* Add task form */
    .add-task-form {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.grow { flex: 1; min-width: 200px; }

    .form-group label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .form-input {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus { border-color: var(--accent); }

    .form-input::placeholder { color: var(--text-muted); }

    .form-select {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
    }

    .form-select:focus { border-color: var(--accent); }

    .add-task-btn {
      background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2));
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .add-task-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    /* Task columns (Kanban) */
    .tasks-columns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    @media (max-width: 1100px) {
      .tasks-columns { grid-template-columns: 1fr; }
    }

    .task-column {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      min-height: 200px;
    }

    .column-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .column-header h3 {
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .column-count {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .column-header.col-todo { border-top: 3px solid var(--text-muted); }
    .column-header.col-progress { border-top: 3px solid var(--aurora-1); }
    .column-header.col-done { border-top: 3px solid var(--success); }

    .column-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Task card */
    .task-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      transition: all 0.2s;
      cursor: default;
    }

    .task-card:hover {
      border-color: rgba(123, 104, 238, 0.4);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }

    .task-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .task-text {
      font-size: 14px;
      line-height: 1.4;
      flex: 1;
    }

    .task-card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .priority-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .priority-critical { background: #ff4444; box-shadow: 0 0 8px rgba(255, 68, 68, 0.5); }
    .priority-high { background: var(--danger); }
    .priority-normal { background: var(--aurora-1); }
    .priority-low { background: var(--text-muted); }

    .priority-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .priority-label.critical { color: #ff4444; }
    .priority-label.high { color: var(--danger); }
    .priority-label.normal { color: var(--aurora-1); }
    .priority-label.low { color: var(--text-muted); }

    .task-date {
      font-size: 11px;
      color: var(--text-muted);
    }

    .task-actions {
      display: flex;
      gap: 4px;
    }

    .task-action-btn {
      background: none;
      border: 1px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 13px;
      transition: all 0.2s;
    }

    .task-action-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border);
      color: var(--text-primary);
    }

    .task-action-btn.btn-done:hover {
      background: rgba(0, 212, 170, 0.15);
      border-color: var(--success);
      color: var(--success);
    }

    .task-action-btn.btn-start:hover {
      background: rgba(123, 104, 238, 0.15);
      border-color: var(--aurora-1);
      color: var(--aurora-1);
    }

    .task-action-btn.btn-delete:hover {
      background: rgba(255, 107, 157, 0.1);
      border-color: var(--danger);
      color: var(--danger);
    }

    .task-deadline {
      font-size: 11px;
      color: var(--warning);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Clean button */
    .clean-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .clean-btn:hover {
      background: rgba(255, 107, 157, 0.1);
      border-color: var(--danger);
      color: var(--danger);
    }

    .tasks-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .tasks-toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .column-empty {
      text-align: center;
      padding: 24px 16px;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Nav separator */
    .nav-separator {
      height: 1px;
      background: var(--border);
      margin: 8px 16px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">A</div>
          <div class="logo-text">
            <h1>Aurora</h1>
            <span>Skin Bot Admin</span>
          </div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <div class="nav-item active" data-page="dashboard">
          <span class="icon">&#9632;</span> Dashboard
        </div>
        <div class="nav-item" data-page="tasks">
          <span class="icon">&#9745;</span> Tasks
          <span class="badge" id="badge-tasks" style="background: linear-gradient(135deg, var(--aurora-1), var(--aurora-2))">0</span>
        </div>
        <div class="nav-separator"></div>
        <div class="nav-item" data-page="skin">
          <span class="icon">&#128270;</span> Skin
          <span class="badge" id="badge-skin">0</span>
        </div>
        <div class="nav-item" data-page="food">
          <span class="icon">&#127860;</span> Food
          <span class="badge" id="badge-food">0</span>
        </div>
        <div class="nav-item" data-page="cosmetic">
          <span class="icon">&#129524;</span> Cosmetic
          <span class="badge" id="badge-cosmetic">0</span>
        </div>
        <div class="nav-item" data-page="users">
          <span class="icon">&#128100;</span> Users
          <span class="badge" id="badge-users">0</span>
        </div>
      </nav>
      <div class="sidebar-footer">
        <button class="export-btn" onclick="exportData()">
          &#128229; Export JSON
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main" id="main">
      <div class="loading"><div class="spinner"></div></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let currentPage = 'dashboard';
    let stats = {};
    let pagination = { food: 0, skin: 0, cosmetic: 0 };
    const PAGE_SIZE = 30;

    // Init
    async function init() {
      await loadStats();
      renderPage('dashboard');
      setupNav();
    }

    function setupNav() {
      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          currentPage = item.dataset.page;
          pagination = { food: 0, skin: 0, cosmetic: 0 };
          renderPage(currentPage);
        });
      });
    }

    async function loadStats() {
      const [statsRes, tasksRes] = await Promise.all([
        fetch('/api/stats'),
        fetch('/api/tasks/progress'),
      ]);
      stats = await statsRes.json();
      const taskProgress = await tasksRes.json();
      document.getElementById('badge-skin').textContent = stats.totalSkin;
      document.getElementById('badge-food').textContent = stats.totalFood;
      document.getElementById('badge-cosmetic').textContent = stats.totalCosmetic;
      document.getElementById('badge-users').textContent = stats.uniqueUsers;
      document.getElementById('badge-tasks').textContent = taskProgress.todo + taskProgress.inProgress;
    }

    function renderPage(page) {
      switch (page) {
        case 'dashboard': renderDashboard(); break;
        case 'tasks': renderTasks(); break;
        case 'skin': renderEntries('skin'); break;
        case 'food': renderEntries('food'); break;
        case 'cosmetic': renderEntries('cosmetic'); break;
        case 'users': renderUsers(); break;
      }
    }

    // Dashboard
    function renderDashboard() {
      const main = document.getElementById('main');
      main.innerHTML = `
        <div class="page-header">
          <h2>Dashboard</h2>
          <p>Skin Bot analytics overview</p>
        </div>
        <div class="stats-grid">
          <div class="stat-card purple">
            <div class="stat-icon">&#128270;</div>
            <div class="stat-value">${stats.totalSkin || 0}</div>
            <div class="stat-label">Skin Analyses</div>
          </div>
          <div class="stat-card orange">
            <div class="stat-icon">&#127860;</div>
            <div class="stat-value">${stats.totalFood || 0}</div>
            <div class="stat-label">Food Analyses</div>
          </div>
          <div class="stat-card green">
            <div class="stat-icon">&#129524;</div>
            <div class="stat-value">${stats.totalCosmetic || 0}</div>
            <div class="stat-label">Cosmetic Checks</div>
          </div>
          <div class="stat-card pink">
            <div class="stat-icon">&#128100;</div>
            <div class="stat-value">${stats.uniqueUsers || 0}</div>
            <div class="stat-label">Users</div>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card purple">
            <div class="stat-icon">&#128202;</div>
            <div class="stat-value">${stats.avgSkinScore || '---'}</div>
            <div class="stat-label">Avg Skin Score</div>
          </div>
          <div class="stat-card green">
            <div class="stat-icon">&#128196;</div>
            <div class="stat-value">${stats.totalEntries || 0}</div>
            <div class="stat-label">Total Entries</div>
          </div>
          <div class="stat-card orange">
            <div class="stat-icon">&#128197;</div>
            <div class="stat-value">${stats.firstDate || '---'}</div>
            <div class="stat-label">First Entry</div>
          </div>
          <div class="stat-card pink">
            <div class="stat-icon">&#128197;</div>
            <div class="stat-value">${stats.lastDate || '---'}</div>
            <div class="stat-label">Last Entry</div>
          </div>
        </div>
      `;
    }

    // Entries table
    async function renderEntries(type) {
      const main = document.getElementById('main');
      main.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      const offset = pagination[type] || 0;
      const res = await fetch(`/api/entries/${type}?limit=${PAGE_SIZE}&offset=${offset}`);
      const { entries, total } = await res.json();

      const titles = { food: 'Food Analyses', skin: 'Skin Analyses', cosmetic: 'Cosmetic Checks' };
      const icons = { food: '&#127860;', skin: '&#128270;', cosmetic: '&#129524;' };

      if (entries.length === 0) {
        main.innerHTML = `
          <div class="page-header">
            <h2>${titles[type]}</h2>
            <p>Entries from bot database</p>
          </div>
          <div class="empty-state">
            <div class="icon">${icons[type]}</div>
            <h3>No entries yet</h3>
            <p>Data will appear here when users start sending photos to the bot.</p>
          </div>
        `;
        return;
      }

      let tableHTML = '';
      if (type === 'skin') {
        tableHTML = `
          <table>
            <thead><tr><th>Date</th><th>User</th><th>Score</th><th>Analysis</th><th></th></tr></thead>
            <tbody>
              ${entries.map((e, i) => `
                <tr>
                  <td><span class="date-text">${formatDate(e.createdAt)}</span></td>
                  <td><span class="user-id">${e.userId}</span></td>
                  <td>${scoreHTML(e.score, 10)}</td>
                  <td><div class="analysis-text" onclick="this.classList.toggle('expanded')">${escapeHtml(e.analysis || '')}</div></td>
                  <td><button class="delete-btn" onclick="deleteEntry('${type}', ${offset + i})" title="Delete">&#128465;</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } else if (type === 'food') {
        tableHTML = `
          <table>
            <thead><tr><th>Date</th><th>User</th><th>Analysis</th><th></th></tr></thead>
            <tbody>
              ${entries.map((e, i) => `
                <tr>
                  <td><span class="date-text">${formatDate(e.createdAt)}</span></td>
                  <td><span class="user-id">${e.userId}</span></td>
                  <td><div class="analysis-text" onclick="this.classList.toggle('expanded')">${escapeHtml(e.analysis || '')}</div></td>
                  <td><button class="delete-btn" onclick="deleteEntry('${type}', ${offset + i})" title="Delete">&#128465;</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } else {
        tableHTML = `
          <table>
            <thead><tr><th>Date</th><th>User</th><th>Product</th><th>Safety</th><th>Analysis</th><th></th></tr></thead>
            <tbody>
              ${entries.map((e, i) => `
                <tr>
                  <td><span class="date-text">${formatDate(e.createdAt)}</span></td>
                  <td><span class="user-id">${e.userId}</span></td>
                  <td>${escapeHtml(e.productName || '---')}</td>
                  <td>${e.safetyScore === 10 ? '<span class="score-badge score-good">SAFE</span>' : e.safetyScore === 0 ? '<span class="score-badge score-bad">UNSAFE</span>' : '<span class="score-badge score-mid">?</span>'}</td>
                  <td><div class="analysis-text" onclick="this.classList.toggle('expanded')">${escapeHtml(e.analysis || '')}</div></td>
                  <td><button class="delete-btn" onclick="deleteEntry('${type}', ${offset + i})" title="Delete">&#128465;</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      const totalPages = Math.ceil(total / PAGE_SIZE);
      const currentPageNum = Math.floor(offset / PAGE_SIZE) + 1;

      main.innerHTML = `
        <div class="page-header">
          <h2>${titles[type]}</h2>
          <p>Entries from bot database</p>
        </div>
        <div class="table-card">
          <div class="table-header">
            <h3>${icons[type]} ${titles[type]}</h3>
            <span class="count">${total} total</span>
          </div>
          ${tableHTML}
          ${totalPages > 1 ? `
            <div class="pagination">
              <button class="page-btn" onclick="changePage('${type}', -1)" ${currentPageNum <= 1 ? 'disabled' : ''}>&#8592; Prev</button>
              <span class="page-info">${currentPageNum} / ${totalPages}</span>
              <button class="page-btn" onclick="changePage('${type}', 1)" ${currentPageNum >= totalPages ? 'disabled' : ''}>Next &#8594;</button>
            </div>
          ` : ''}
        </div>
      `;
    }

    // Users
    async function renderUsers() {
      const main = document.getElementById('main');
      main.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      const res = await fetch('/api/users');
      const users = await res.json();

      if (users.length === 0) {
        main.innerHTML = `
          <div class="page-header">
            <h2>Users</h2>
            <p>Bot users activity</p>
          </div>
          <div class="empty-state">
            <div class="icon">&#128100;</div>
            <h3>No users yet</h3>
            <p>Users will appear here when they start using the bot.</p>
          </div>
        `;
        return;
      }

      main.innerHTML = `
        <div class="page-header">
          <h2>Users</h2>
          <p>${users.length} users total</p>
        </div>
        ${users.map(u => `
          <div class="user-card">
            <div class="user-avatar">${String(u.userId).slice(-2)}</div>
            <div class="user-info">
              <h4>User ${u.userId}</h4>
              <p>Last active: ${u.lastActive ? formatDate(u.lastActive) : '---'}</p>
            </div>
            <div class="user-stats">
              <div class="user-stat">
                <div class="num" style="color: var(--aurora-1)">${u.skin}</div>
                <div class="label">Skin</div>
              </div>
              <div class="user-stat">
                <div class="num" style="color: var(--warning)">${u.food}</div>
                <div class="label">Food</div>
              </div>
              <div class="user-stat">
                <div class="num" style="color: var(--success)">${u.cosmetic}</div>
                <div class="label">Cosmetic</div>
              </div>
            </div>
          </div>
        `).join('')}
      `;
    }

    // =============================================
    // TASKS
    // =============================================

    async function renderTasks() {
      const main = document.getElementById('main');
      main.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

      const [tasksRes, progressRes] = await Promise.all([
        fetch('/api/tasks'),
        fetch('/api/tasks/progress'),
      ]);
      const tasks = await tasksRes.json();
      const progress = await progressRes.json();

      const todoTasks = tasks.filter(t => t.status === 'todo');
      const inProgressTasks = tasks.filter(t => t.status === 'in_progress');
      const doneTasks = tasks.filter(t => t.status === 'done');

      // Update badge
      const activeTasks = todoTasks.length + inProgressTasks.length;
      document.getElementById('badge-tasks').textContent = activeTasks;

      const todayStr = new Date().toLocaleDateString('ru-RU', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });

      main.innerHTML = `
        <div class="page-header">
          <h2>Aurora Tasks</h2>
          <p>${todayStr}</p>
        </div>

        <!-- Progress -->
        <div class="progress-bar-wrap">
          <div class="progress-header">
            <h3>Progress today</h3>
            <span class="progress-percent">${progress.percent}%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width: ${progress.percent}%"></div>
          </div>
          <div class="progress-stats">
            <span><span class="dot dot-done"></span> Done: ${progress.done}</span>
            <span><span class="dot dot-progress"></span> In progress: ${progress.inProgress}</span>
            <span><span class="dot dot-todo"></span> Todo: ${progress.todo}</span>
            <span>Total: ${progress.total}</span>
          </div>
        </div>

        <!-- Add task form -->
        <form class="add-task-form" onsubmit="handleAddTask(event)">
          <div class="form-group grow">
            <label>Task</label>
            <input type="text" class="form-input" id="taskText" placeholder="What needs to be done?" required>
          </div>
          <div class="form-group">
            <label>Priority</label>
            <select class="form-select" id="taskPriority">
              <option value="normal">Normal</option>
              <option value="critical">Critical</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="form-group">
            <label>Category</label>
            <input type="text" class="form-input" id="taskCategory" placeholder="e.g. Content" style="width: 120px">
          </div>
          <div class="form-group">
            <label>Deadline</label>
            <input type="date" class="form-input" id="taskDeadline">
          </div>
          <button type="submit" class="add-task-btn">+ Add</button>
        </form>

        <!-- Toolbar -->
        <div class="tasks-toolbar">
          <div class="tasks-toolbar-left">
            <span style="font-size: 13px; color: var(--text-muted)">${tasks.length} tasks total</span>
          </div>
          ${doneTasks.length > 0 ? '<button class="clean-btn" onclick="handleCleanTasks()">Clear done (' + doneTasks.length + ')</button>' : ''}
        </div>

        <!-- Kanban columns -->
        <div class="tasks-columns">
          <!-- TODO -->
          <div class="task-column">
            <div class="column-header col-todo">
              <h3>Todo <span class="column-count">${todoTasks.length}</span></h3>
            </div>
            <div class="column-body">
              ${todoTasks.length === 0 ? '<div class="column-empty">No pending tasks</div>' :
                todoTasks.map(t => renderTaskCard(t)).join('')}
            </div>
          </div>

          <!-- IN PROGRESS -->
          <div class="task-column">
            <div class="column-header col-progress">
              <h3>In Progress <span class="column-count">${inProgressTasks.length}</span></h3>
            </div>
            <div class="column-body">
              ${inProgressTasks.length === 0 ? '<div class="column-empty">Nothing in progress</div>' :
                inProgressTasks.map(t => renderTaskCard(t)).join('')}
            </div>
          </div>

          <!-- DONE -->
          <div class="task-column">
            <div class="column-header col-done">
              <h3>Done <span class="column-count">${doneTasks.length}</span></h3>
            </div>
            <div class="column-body">
              ${doneTasks.length === 0 ? '<div class="column-empty">Nothing completed yet</div>' :
                doneTasks.map(t => renderTaskCard(t)).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderTaskCard(task) {
      const priorityLabels = { critical: 'Critical', high: 'High', normal: 'Normal', low: 'Low' };
      const isDone = task.status === 'done';
      const textStyle = isDone ? 'text-decoration: line-through; opacity: 0.6;' : '';

      let actions = '';
      if (task.status === 'todo') {
        actions = `
          <button class="task-action-btn btn-start" onclick="handleTaskStatus(${task.id}, 'in_progress')" title="Start">&#9654;</button>
          <button class="task-action-btn btn-done" onclick="handleTaskStatus(${task.id}, 'done')" title="Done">&#10003;</button>
          <button class="task-action-btn btn-delete" onclick="handleDeleteTask(${task.id})" title="Delete">&#10005;</button>
        `;
      } else if (task.status === 'in_progress') {
        actions = `
          <button class="task-action-btn btn-done" onclick="handleTaskStatus(${task.id}, 'done')" title="Done">&#10003;</button>
          <button class="task-action-btn" onclick="handleTaskStatus(${task.id}, 'todo')" title="Back to Todo">&#8634;</button>
          <button class="task-action-btn btn-delete" onclick="handleDeleteTask(${task.id})" title="Delete">&#10005;</button>
        `;
      } else {
        actions = `
          <button class="task-action-btn" onclick="handleTaskStatus(${task.id}, 'todo')" title="Reopen">&#8634;</button>
          <button class="task-action-btn btn-delete" onclick="handleDeleteTask(${task.id})" title="Delete">&#10005;</button>
        `;
      }

      const deadlineHTML = task.deadline
        ? `<span class="task-deadline">&#128197; ${task.deadline}</span>`
        : '';

      const categoryHTML = task.category
        ? `<span class="score-badge score-mid" style="font-size: 11px; padding: 2px 8px;">${escapeHtml(task.category)}</span>`
        : '';

      return `
        <div class="task-card">
          <div class="task-card-top">
            <div class="task-text" style="${textStyle}">${escapeHtml(task.text)}</div>
          </div>
          <div class="task-card-bottom">
            <div class="task-meta">
              <span class="priority-dot priority-${task.priority}"></span>
              <span class="priority-label ${task.priority}">${priorityLabels[task.priority] || 'Normal'}</span>
              ${categoryHTML}
              ${deadlineHTML}
            </div>
            <div class="task-actions">${actions}</div>
          </div>
        </div>
      `;
    }

    async function handleAddTask(e) {
      e.preventDefault();
      const text = document.getElementById('taskText').value.trim();
      const priority = document.getElementById('taskPriority').value;
      const category = document.getElementById('taskCategory').value.trim();
      const deadline = document.getElementById('taskDeadline').value || null;

      if (!text) return;

      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, priority, category, deadline }),
      });

      showToast('Task added');
      renderTasks();
    }

    async function handleTaskStatus(id, status) {
      await fetch(`/api/tasks/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });
      const label = status === 'done' ? 'Task completed!' : status === 'in_progress' ? 'Started' : 'Reopened';
      showToast(label);
      renderTasks();
    }

    async function handleDeleteTask(id) {
      if (!confirm('Delete this task?')) return;
      await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
      showToast('Task deleted');
      renderTasks();
    }

    async function handleCleanTasks() {
      if (!confirm('Remove all completed tasks?')) return;
      const res = await fetch('/api/tasks/clean', { method: 'POST' });
      const { removed } = await res.json();
      showToast(`Cleared ${removed} tasks`);
      renderTasks();
    }

    // Helpers
    function formatDate(iso) {
      if (!iso) return '---';
      const d = new Date(iso);
      return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
        ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function scoreHTML(score, max) {
      if (score == null) return '<span class="score-badge score-mid">---</span>';
      const cls = score >= 7 ? 'score-good' : score >= 4 ? 'score-mid' : 'score-bad';
      return `<span class="score-badge ${cls}">${score}/${max}</span>`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function changePage(type, dir) {
      pagination[type] = Math.max(0, (pagination[type] || 0) + dir * PAGE_SIZE);
      renderEntries(type);
    }

    async function deleteEntry(type, index) {
      if (!confirm('Delete this entry?')) return;
      const res = await fetch(`/api/entries/${type}/${index}`, { method: 'DELETE' });
      const { success } = await res.json();
      if (success) {
        showToast('Entry deleted');
        await loadStats();
        renderPage(currentPage);
      } else {
        showToast('Failed to delete');
      }
    }

    function exportData() {
      window.location.href = '/api/export';
      showToast('Exporting data...');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    init();
  </script>
</body>
</html>
