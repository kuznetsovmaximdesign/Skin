# Механизируемая часть гайда по формулировке. Правит редактор, а не программист.
# Эти правила проверяются автоматически; текст гайда по-прежнему уходит в модель.

max_sentence_words: 25
check_passive: true

# Слова, которых быть не должно, и причина
forbidden:
  скоро: "не обещаем сроков"
  революционный: "маркетинговая лексика"
  уникальный: "маркетинговая лексика"
  просто: "оценочное слово, читателю может быть непросто"

# Принятые написания: слева — как писать нельзя, справа — как нужно
substitutions:
  юзер: пользователь
  залогиниться: войти
  статья: документ
  материал: документ

# Глоссарий терминов: единые названия сущностей
glossary:
  эндпойнт: эндпоинт
  ключ доступа: токен доступа
