# Шаблон статьи как машинно-проверяемая спецификация.
# Несоответствие шаблону — такое же нарушение, как стилевое.

required_sections:
  - Назначение
  - Ограничения

enforce_order: true

# Ожидаемые уровни заголовков для известных разделов
section_levels:
  Назначение: 2
  Предварительные условия: 2
  Ограничения: 2

# Обязательные поля front-matter. Пустой список — front-matter не требуется.
front_matter: []

require_image_alt: true

# Допустимые типы врезок: > [!NOTE], > [!WARNING] …
admonitions:
  - NOTE
  - TIP
  - IMPORTANT
  - WARNING
  - CAUTION
