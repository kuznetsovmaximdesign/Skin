# Конфигурация локального сервиса обновления документации.
# Всё работает офлайн: единственный сетевой адрес — Ollama на localhost.
# Дефолты рассчитаны на MacBook на Apple Silicon (M3 Pro, 18 ГБ единой памяти).

ollama:
  host: "http://localhost:11434"
  # Модель генерации. По умолчанию qwen3:4b — быстро и без риска (ollama pull qwen3:4b).
  # На 18 ГБ реально поставить и qwen3:8b: качество выше, ответ медленнее.
  generation_model: "qwen3:4b"
  # Модель эмбеддингов: bge-m3 мультиязычная (~1–1,5 ГБ), это важно для 15 языковых версий.
  # Более лёгкая альтернатива: nomic-embed-text.
  embedding_model: "bge-m3"
  # Сколько Ollama держит модель в памяти после запроса. Короткое значение освобождает RAM.
  keep_alive: "5m"
  # Выгружать модель эмбеддингов перед генерацией и наоборот, чтобы модели
  # не держались в памяти одновременно. На 18 ГБ это заметно помогает.
  sequential_models: true
  # Таймаут запроса к Ollama, секунды (генерация большого документа бывает долгой)
  request_timeout: 900

paths:
  # Папка с существующей документацией (.md). Путь относительный от docs-updater/ или абсолютный.
  docs_dir: "data/docs"
  # Файлы с правилами оформления (.md). Можно несколько — все уйдут в инструкцию модели.
  style_guides:
    - "data/styleguide.md"
  # Папка с образцами документации: по ним сервис сам выводит формат.
  samples_dir: "data/samples"
  # Куда сохраняются правила, выведенные из образцов.
  derived_guide: "data/derived-guide.md"
  # Учитывать ли выведенные из образцов правила (явные правила всё равно главнее).
  use_derived_guide: true
  # Локальный индекс: SQLite-файл рядом с сервисом, никаких внешних БД.
  index_file: "data/index.sqlite3"
  # Куда складывать обновлённые документы (оригиналы не перезаписываются)
  output_dir: "data/output"
  # Наборы предложенных правок (changeset) и локальный лог отклонений писателя
  changesets_dir: "data/changesets"
  feedback_log: "data/feedback.jsonl"

search:
  # Сколько кандидатов показывать писателю
  top_k: 5
  # Максимальный размер секции в символах (длинные секции режутся на части)
  chunk_max_chars: 1800
  # Сколько секций отправлять в модель эмбеддингов за один запрос.
  # Меньше батч — меньше пиковая память.
  embed_batch: 8

generation:
  temperature: 0.2
  # Размер контекста модели; увеличьте, если документы длинные.
  # Для qwen3:4b на 18 ГБ 8192 — разумный компромисс, при необходимости можно 16384.
  num_ctx: 8192

# Продукты. У каждого свои документы, гайды, шаблон, индекс и результаты.
# Поля, которых нет у продукта, наследуются из общих настроек выше.
products:
  default: "core"
  items:
    core:
      name: "Основной продукт"
    # Пример второго продукта: раскомментируйте и поправьте пути.
    # beta:
    #   name: "Бета"
    #   docs_dir: "data/beta/docs"
    #   style_guides: ["data/beta/styleguide.md"]
    #   template_schema: "data/beta/template.schema.yaml"
    #   index_file: "data/beta/index.sqlite3"
    #   output_dir: "data/beta/output"

# Языковые версии одной статьи.
languages:
  # Язык-источник: на нём делаются правки, остальные версии получаются каскадом.
  source: "ru"
  # Целевые языки (15 версий документа)
  targets: ["en", "de", "fr", "es", "it", "pt", "pl", "tr", "kk", "uz", "hy", "ka", "zh", "ja", "ar"]
  # Как разложены файлы: folder → docs/<язык>/путь, suffix → путь/имя.<язык>.md
  layout: "folder"
  # Языки, на которых открытые модели слабее: версии помечаются как требующие вычитки
  low_resource: ["kk", "uz", "hy", "ka", "ar"]
  # Общий термбейз: те же термины, что проверяет модуль соответствия
  glossary: "data/glossary.yaml"

# Конфиденциальность, доступ и аудит.
# Публикация. Выключена по умолчанию: сервис офлайн, наружу ничего не уходит.
# Адреса — внутренние, доступы берутся из переменных окружения, не из файла.
publish:
  enabled: false
  confluence:
    base_url: ""        # например https://confluence.internal
    space: ""
    auth_env: "CONFLUENCE_TOKEN"
  portal:
    base_url: ""        # например https://help.internal
    auth_env: "PORTAL_TOKEN"
  # Соответствие «документ ↔ страница ↔ статья», чтобы повторная публикация обновляла
  registry: "data/publications.json"

security:
  # Доступ: none — локальный сервис без проверки; rutoken — только по аппаратному токену.
  auth: "none"
  # Отпечаток сертификата с Рутокена → роль. Заполняется при auth: rutoken.
  tokens: {}
  #   "3f2a…c91": "lead"
  default_role: "writer"
  roles:
    writer:
      classifications: ["public", "internal"]
    lead:
      classifications: ["public", "internal", "confidential"]
  # Документы этих путей всегда считаются конфиденциальными
  confidential_paths: ["secret/*", "*/secret/*"]
  # Уровень по умолчанию, если в документе нет поля classification
  default_classification: "internal"
  # Журнал событий: пишутся только факты обращений, без текстов и без ФТ
  audit: true
  audit_log: "data/audit.jsonl"

checks:
  # Машинная проверка соответствия: формулировка + оформление + шаблон.
  enabled: true
  # Встроенные проверки работают всегда, без установки чего-либо.
  builtin_prose: true
  builtin_markdown: true
  schema: true
  # Артефакты разбора портала: типы статей, KDOC-правила, глоссарий.
  # По умолчанию берётся docs-config/ в корне репозитория.
  # docs_config_dir: "../docs-config"
  # Уровни отдельных KDOC-правил можно поднимать и опускать здесь:
  # kdoc:
  #   KDOC-TABLE-FOR-PARALLEL: error
  #   KDOC-ESCALATION: off
  # Правила формулировки и шаблон статьи (правит редактор)
  prose_rules: "data/style-rules.yaml"
  template_schema: "data/template.schema.yaml"
  # Оформление
  max_line_length: 120
  bullet_marker: "-"
  require_fence_language: true
  # Внешние линтеры подключаются автоматически, если установлены в системе.
  # macOS: brew install vale && npm i -g markdownlint-cli2
  use_vale: true
  vale_binary: "vale"
  vale_config: ".vale.ini"
  use_markdownlint: true
  markdownlint_command: "markdownlint-cli2"
  # Сколько раз просить модель починить найденные нарушения
  max_fix_iterations: 2
